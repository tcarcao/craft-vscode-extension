name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run bundle

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Update package.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $VERSION"
          echo "Current package.json version: $CURRENT_VERSION"

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "Updating package.json to version: $VERSION"
            npm version $VERSION --no-git-tag-version

            echo "Updating README.md with version: $VERSION"
            sed -i.bak "s/craft-arch-diagrams-[0-9]\+\.[0-9]\+\.[0-9]\+\.vsix/craft-arch-diagrams-$VERSION.vsix/g" README.md
            rm README.md.bak
          else
            echo "Version already matches tag, skipping version bump"
          fi
      
      - name: Build extension
        run: npm run bundle

      - name: Get package info
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Channel is derived from the minor version, following VS Code's documented
      # pre-release recommendation: odd minor (0.3.x) = pre-release channel,
      # even minor (0.2.x) = stable channel.
      # https://code.visualstudio.com/api/working-with-extensions/publishing-extension#prerelease-extensions
      #
      # A semver prerelease suffix (0.3.0-beta.1) is NOT a usable signal here:
      # `vsce publish` hard-rejects it ("The VS Marketplace doesn't support
      # prerelease versions"), so the minor-parity scheme is the only one both
      # registries accept.
      - name: Determine release channel
        id: channel
        run: |
          MINOR=$(echo "${{ steps.package.outputs.version }}" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "Minor version $MINOR is odd -> pre-release channel"
            echo "flag=--pre-release" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "label=pre-release" >> $GITHUB_OUTPUT
          else
            echo "Minor version $MINOR is even -> stable channel"
            echo "flag=" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "label=stable" >> $GITHUB_OUTPUT
          fi

      # Packaged once, after the channel is known, so the pre-release property is
      # baked into the VSIX manifest. The same artifact is then attached to the
      # GitHub release AND published to both registries via --packagePath, so the
      # three distribution points cannot drift.
      - name: Package extension (${{ steps.channel.outputs.label }})
        run: npx @vscode/vsce package ${{ steps.channel.outputs.flag }}

      - name: Smoke-test craft binary download
        run: |
          VERSION=$(node -p "require('./package.json').lspVersion")
          ARCHIVE="craft_${VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/tcarcao/craft/releases/download/v${VERSION}"

          CHECKSUMS=$(curl -fsSL "${BASE_URL}/checksums.txt")
          EXPECTED=$(printf '%s\n' "$CHECKSUMS" | grep "$ARCHIVE" | awk '{print $1}')

          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "$ARCHIVE"
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

          tar xzf "$ARCHIVE" craft
          chmod +x craft
          ./craft --version
          ./craft lsp --help

      - name: Commit version bump back to repository
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "Version mismatch detected, this should not happen after version update step"
            exit 1
          fi

          if git diff --quiet package.json README.md; then
            echo "No version changes to commit (version already matched tag)"
          else
            echo "Committing version bump to $VERSION"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add package.json README.md
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:main
          fi
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Craft Language VS Code Extension
            
            Release of Craft Language VS Code Extension v${{ steps.package.outputs.version }}
            (published to the **${{ steps.channel.outputs.label }}** Marketplace channel)

            ## Installation
            1. Download the `.vsix` file from the assets below
            2. Open VS Code
            3. Press `Ctrl+Shift+P` (or `Cmd+Shift+P` on Mac) to open the command palette
            4. Type "Extensions: Install from VSIX..." and select it
            5. Choose the downloaded `.vsix` file
            
            Or install from command line:
            ```bash
            code --install-extension ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
            ```
            
            ## Features
            - 🎨 **Syntax Highlighting**: Rich semantic highlighting for `.craft` files
            - 🖥️ **Language Server**: Real-time validation and error checking
            - 🌳 **Domain Manager**: Interactive tree view for managing domains and services
            - 📊 **Live Diagram Previews**: Generate C4, domain, sequence, and context diagrams
            - ⌨️ **Keyboard Shortcuts**: Quick access to diagram previews
            
            ## Requirements
            Requires a Craft server running (default on `localhost:8080`, but available to change in settings) for diagram generation.
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
      
      - name: Upload VSIX to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
          asset_name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
          asset_content_type: application/zip

      - name: Publish to VS Code Marketplace (${{ steps.channel.outputs.label }})
        run: >
          npx @vscode/vsce publish ${{ steps.channel.outputs.flag }}
          --packagePath ./${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix
          -p ${{ secrets.DEV_AZURE_PERSONAL_TOKEN }}
        env:
          VSCE_PAT: ${{ secrets.DEV_AZURE_PERSONAL_TOKEN }}

      - name: Publish to Open VSX Registry (${{ steps.channel.outputs.label }})
        run: npx ovsx publish ${{ steps.channel.outputs.flag }} ./${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.vsix -p ${{ secrets.OVSX_PAT }}